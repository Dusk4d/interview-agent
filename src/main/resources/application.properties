spring.application.name=interview-agent
server.port=8090
server.shutdown=graceful
spring.mvc.problemdetails.enabled=false
# 简历可能较大，允许 10MB 上传
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.cachecontrol.max-age=60s

# ---------------------------------------------------------------- 应用配置
app.llm.base-url=${INTERVIEW_LLM_BASE_URL:http://127.0.0.1:1234/v1}
app.llm.api-key=${INTERVIEW_LLM_API_KEY:lm-studio}
app.llm.chat-model=${INTERVIEW_LLM_CHAT_MODEL:qwen2.5-7b-instruct}
app.llm.embedding-model=${INTERVIEW_LLM_EMBEDDING_MODEL:text-embedding-nomic-embed-text-v1.5}
app.llm.temperature=0.3
app.llm.max-tokens=1600
app.llm.connect-timeout-ms=3000
app.llm.read-timeout-ms=45000
app.llm.max-retries=${INTERVIEW_LLM_MAX_RETRIES:0}
app.llm.probe-on-startup=true

app.embedding.mode=${INTERVIEW_EMBEDDING_MODE:local}
app.embedding.dimension=256
app.embedding.batch-size=16

app.retrieval.top-k=${INTERVIEW_RETRIEVAL_TOP_K:5}
app.retrieval.min-score=0.08
app.retrieval.max-context-chars=4000
app.retrieval.knowledge-top-k=4

app.interview.max-questions=8
app.interview.follow-up-limit-per-question=1
app.interview.min-answer-chars=8
app.interview.max-answer-chars=4000

app.privacy.mask-pii=true
app.privacy.mask-name=false

app.storage.mode=${INTERVIEW_STORAGE_MODE:file}
app.storage.data-dir=${INTERVIEW_DATA_DIR:}
app.parser.max-file-bytes=10485760
app.logging.pretty=false

logging.level.root=INFO
logging.level.com.dusk4d.interview=INFO
