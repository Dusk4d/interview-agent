# 测试专用配置：全部离线可跑、结果确定
app.llm.base-url=http://127.0.0.1:59999/v1
app.llm.api-key=test
app.llm.chat-model=mock-model
app.llm.connect-timeout-ms=300
app.llm.read-timeout-ms=1000
app.llm.probe-on-startup=false
app.embedding.mode=local
app.embedding.dimension=128
app.retrieval.top-k=4
app.retrieval.knowledge-top-k=3
app.retrieval.min-score=0.05
app.storage.mode=memory
app.interview.max-questions=6
app.interview.follow-up-limit-per-question=1
app.privacy.mask-pii=true
logging.level.root=WARN
logging.level.com.dusk4d.interview=INFO
